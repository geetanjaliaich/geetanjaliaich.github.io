  - year: 2024
    category: AI for Health and Miscellaneous
    visual: Journal of the Indian Society of Remote Sensing
    title: "Otsu-BRSG: An Effective Algorithm for River Bank Line Detection and Monitoring in the Challenging Terrains of Kaziranga National Park"
    description: >-
      This study uses multispectral Landsat and Sentinel-2 imagery to monitor the Brahmaputra river bank near Kaziranga National Park. It combines Savitzky–Golay smoothing with an Otsu-based boundary-refinement algorithm to track difficult, changing terrain. Analysis from 2008–2018 identified erosion and a net loss of 540.63 hectares of wooded area, with Majuli Island used as an additional case study.
    authors:
      - Srutiparna Neogi*
      - Geetanjali Aich*
      - Aniruddha Dey
      - Sanjit Maitra
      - Oishila Bandyopadhyay
      - Kuntal Ghosh
    venue: Journal of the Indian Society of Remote Sensing, 52, 1–20
    note: "* Equal contribution"
    url: https://doi.org/10.1007/s12524-024-01843-z
  - year: 2024
    category: AI for Health and Miscellaneous
    visual: Multimedia Tools and Applications
    title: "Investigating the Impact of Standard Brain Atlases and Connectivity Measures on the Accuracy of ADHD Detection from fMRI Data using Deep Learning"
    description: >-
      The paper studies how brain-atlas and connectivity choices affect deep-learning diagnosis of ADHD from fMRI. It compares image-based connectivity-matrix models with graph-based network-feature models across six atlases, two connectivity measures, and 352 scans. The experiments reveal substantial performance variation across configurations and competitive accuracy against deep-learning baselines.
    authors:
      - Snigdha Agarwal
      - Adarsh Raj
      - Anjan Chowdhury
      - Geetanjali Aich
      - Rajdeep Chatterjee
      - Kuntal Ghosh
    venue: Multimedia Tools and Applications, 83, 67023–67057
    url: https://doi.org/10.1007/s11042-023-17962-7
  - year: 2024
    category: AI for Health and Miscellaneous
    visual: PReMI 2021
    title: "ADHDNet: A DNN Based Framework for Efficient ADHD Detection from fMRI Dataset"
    description: >-
      ADHDNet detects ADHD from functional-connectivity changes in the ADHD-200 fMRI dataset. Complex-network features are extracted using MSDL and BASC brain atlases and classified with a five-layer neural network. Sampling strategies address class imbalance, with the strongest configurations reaching 100% and 93% test accuracy.
    authors:
      - Anjan Chowdhury
      - Rajdeep Chatterjee
      - Geetanjali Aich
      - Kuntal Ghosh
    venue: Pattern Recognition and Machine Intelligence (PReMI 2021)
    url: https://doi.org/10.1007/978-3-031-12700-7_15
  - year: 2022
    category: AI for Health and Miscellaneous
    visual: IEEE CALCON 2022
    title: "Retinal Blood Vessel Segmentation and Analysis using Lightweight Spatial Attention-based CNN and Data Augmentation"
    description: >-
      This work proposes a lightweight encoder–decoder CNN for fast, precise retinal-vessel segmentation under varying image quality and anatomy. The model is evaluated on the DRIVE and CHASE fundus datasets with targeted augmentation. It achieves competitive accuracy and F1 scores with fewer parameters and an average inference time of 0.0059 seconds.
    authors:
      - Srinjoy Bhuiya
      - Soumik Roy Choudhury
      - Geetanjali Aich
      - Muskaan Maurya
      - Anindya Sen
    venue: 2022 IEEE Calcutta Conference (CALCON)
    url: https://ieeexplore.ieee.org/document/10060189/
  - year: 2021
    category: AI for Health and Miscellaneous
    visual: IEEE SMART GENCON 2021
    title: "Optical Disc Segmentation from Color Fundus Image using Contrast Limited Adaptive Histogram Equalization and Morphological Operations"
    description: >-
      This paper develops an automated optic-disc segmentation pipeline for color fundus images, an important step in glaucoma analysis. CLAHE, logarithmic correction, morphological processing, and multi-Otsu thresholding enhance and isolate the disc region on DRISHTI-GS1. The method reports 94.7% average accuracy and an 89.6% F1 score.
    authors:
      - Geetanjali Aich
      - Pramita Banerjee
      - Shreeparna Debnath
      - Anindya Sen
    venue: International Conference on Smart Generation Computing, Communication and Networking (SMART GENCON)
    url: https://ieeexplore.ieee.org/document/9645808/

