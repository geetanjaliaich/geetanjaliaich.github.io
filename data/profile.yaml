about:
  - >-
    I recently completed my Master’s in Computer Science at [UMass Amherst](https://www.umass.edu/) and am currently a CICStep Participant at the [Manning College of Information and Computer Sciences (CICS)](https://www.cics.umass.edu/), [UMass Amherst](https://www.umass.edu/). My current research focuses on social media mining and fine-tuning large language models (LLMs), with broader interests in responsible and trustworthy AI, computational social science, and AI for healthcare. During my time at [UMass Amherst](https://www.umass.edu/), I had the opportunity to collaborate with and be mentored by [Dr. Youngja Park](https://research.ibm.com/people/youngja-park) at [IBM T.J. Watson Research Center](https://research.ibm.com/labs/yorktown-heights) and [Dr. Przemyslaw Grabowicz](https://przemyslslaw.github.io/) through the [SIMS Lab](https://przemyslslaw.github.io/sims-lab/) at [UMass Amherst](https://www.umass.edu/) and [University College Dublin](https://www.ucd.ie/). I also completed an independent study with the [BioNLP Lab at UMass Amherst](https://www.cics.umass.edu/organizations/biomedical-informatics-nlp-lab), where I investigated and adapted 3D multimodal language models for volumetric medical data. These experiences allowed me to work on research involving LLM evaluation, social media analysis, computational social science, and NLP for healthcare.
  - >-
    Before joining [UMass Amherst](https://www.umass.edu/), I worked as a Junior Project Assistant and Research Trainee at the [Center for Soft Computing Research, Indian Statistical Institute (ISI)](https://csscworkshop.wixsite.com/csscisi), Kolkata, under the mentorship of [Dr. Kuntal Ghosh](https://scholar.google.com/citations?user=_ZvzkwIAAAAJ&hl=en) and [Dr. Sanjit Maitra](https://sites.google.com/view/sanjit-maitra/home) from [ISI Tezpur](https://www.isine.ac.in/). My research there primarily focused on AI for healthcare and satellite imaging, contributing to my earlier publications and developing my interest in applying machine learning to interdisciplinary problems. I received my B.Tech. in Electronics and Communication Engineering from [Heritage Institute of Technology](https://heritageit.edu/), Kolkata, where I completed my undergraduate thesis on medical imaging under the mentorship of [Dr. Anindya Sen](https://scholar.google.com/citations?user=vA6hgasAAAAJ&hl=en).
  - >-
    I care deeply about developing AI systems that are fair, inclusive, safe, and representative of diverse communities. I have been fortunate to collaborate with researchers from [![Queer in AI logo](/images/queer-in-ai-logo.png)](https://www.queerinai.com/team) [Queer in AI](https://www.queerinai.com/team) on work exploring these broader questions around AI, representation, and society.
