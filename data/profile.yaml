publications:
  - year: 2026
    category: Responsible AI, Evaluation & Society
    visual: COLM 2026 · MOSS Workshop
    title: "Understanding Small Scale Fine-tuning of LLM-as-a-Judge: A Case Study in Cybersecurity"
    description: >-
      This work studies whether a compact, domain-adapted LLM can reliably judge open-ended cybersecurity answers. It introduces a 150K-sample benchmark of prompts and model responses and fine-tunes a judge with QLoRA and Unsloth. The resulting system improves evaluation accuracy from 40% to 75% while reducing inference runtime by 10×.
    authors:
