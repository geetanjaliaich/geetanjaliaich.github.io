  - year: 2026
    category: Responsible AI, Evaluation & Society
    visual: arXiv · Under Review at TACL
    title: "Queer NLP: A Critical Survey on Literature Gaps, Biases and Trends"
    description: >-
      This survey systematically reviews ACL Anthology research concerning LGBTQIA+ communities and NLP technologies. It maps recurring topics, methods, biases, and omissions across the literature. The study calls for more stakeholder involvement, intersectional and interdisciplinary work, broader language coverage, and proactive harm mitigation.
